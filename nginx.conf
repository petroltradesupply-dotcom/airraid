# nginx's stock mime.types knows neither of these, and the browser cares: a manifest
# served as octet-stream is ignored, which silently costs the app its name, icon and
# standalone display.
types {
    application/manifest+json  webmanifest;
    application/geo+json       geojson;
}

server {
    listen 80;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The map ships ~1 MB of vendored JS and ~800 KB of boundary GeoJSON. Over a phone
    # connection at night that is the difference between opening instantly and waiting.
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Assets are content-addressed by deploy, so they can be cached hard.
    location ~* \.(js|css|png|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Boundaries change roughly never, but not never.
    location ~* \.geojson$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # The live status is the whole point of the status bar: it must never be served from
    # a cache. A stale "no ballistic threat" is exactly the lie this project exists to
    # avoid.
    location /live/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        # Missing file is a normal state (daemon stopped, first boot). The page handles
        # 404 by saying the status is unavailable rather than by showing nothing.
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # No directory listings, no server version.
    autoindex off;
    server_tokens off;
}
